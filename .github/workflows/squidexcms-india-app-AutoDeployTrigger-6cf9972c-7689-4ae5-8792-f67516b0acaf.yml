name: Trigger auto deployment for squidexcms-india-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ production ]
    paths:
    - '**'
    - '.github/workflows/squidexcms-india-app-AutoDeployTrigger-6cf9972c-7689-4ae5-8792-f67516b0acaf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SQUIDEXCMSINDIAAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SQUIDEXCMSINDIAAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SQUIDEXCMSINDIAAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.SQUIDEXCMSINDIAAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SQUIDEXCMSINDIAAPP_REGISTRY_PASSWORD }}
          containerAppName: squidexcms-india-app
          resourceGroup: cms-websites
          imageToBuild: pritamkarar/squidexcms-india-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


